name: Cleanup NuGet Packages by Prefix

on:
  workflow_dispatch:
    inputs:
      package-prefix:
        description: 'Prefix for NuGet packages to clean up (e.g. "Backlot.")'
        required: true
        type: string

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete NuGet packages matching the prefix
        env:
          # Needs a CLASSIC personal access token with read:packages (to list)
          # and delete:packages (to delete) — see the discovery comment below for
          # why GITHUB_TOKEN cannot do this job.
          #
          # An org owner's PAT also removes the per-package chore that
          # GITHUB_TOKEN requires, where each package has to grant this repo
          # Admin under: Package settings -> Manage Actions access.
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          ORG: ${{ github.repository_owner }}
          PACKAGE_PREFIX: ${{ inputs.package-prefix }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret PACKAGES_TOKEN is not set. Create a classic PAT with read:packages and delete:packages, then add it as a repository secret."
            exit 1
          fi

          echo "🔍 Fetching all NuGet packages for org: $ORG"
          echo "🎯 Filtering for packages with prefix: $PACKAGE_PREFIX"
          echo ""

          # Discovery uses the REST API, NOT the registry's /query endpoint.
          #
          # Do not "simplify" this back to
          #   https://nuget.pkg.github.com/{org}/query?q=...
          # That is GitHub Packages' SearchQueryService, and it is a known
          # non-conformant implementation: it ignores `skip`, clamps totalHits to
          # `take`, returns only recently-created packages when `q` is omitted,
          # and answers 400 for query shapes nuget.org accepts. GitHub's own
          # support guidance is to use /orgs/{org}/packages instead.
          #
          # Equally, do not swallow errors here (`2>/dev/null || echo "[]"`): that
          # is what once turned an auth failure into a misleading
          # "no packages found" plus exit 0. Under `set -e` a non-2xx makes gh
          # exit non-zero and print the API error body, which is what we want.
          #
          # per_page maxes out at 100, hence --paginate.
          ALL_NAMES=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/orgs/$ORG/packages?package_type=nuget&per_page=100" \
            --jq '.[].name')

          if [ -z "$ALL_NAMES" ]; then
            echo "ℹ️  No NuGet packages found for org '$ORG'."
            exit 0
          fi

          # Compared case-insensitively: package ids are "Backlot.*", so a
          # lowercase prefix like "backlot" would otherwise match nothing.
          MATCHED=$(printf '%s\n' "$ALL_NAMES" \
            | awk -v p="$PACKAGE_PREFIX" 'BEGIN{p=tolower(p)} tolower(substr($0,1,length(p)))==p' \
            | sort -u)

          if [ -z "$MATCHED" ]; then
            echo "ℹ️  No NuGet packages found with prefix '$PACKAGE_PREFIX'."
            echo ""
            echo "All NuGet packages in org '$ORG' (for debugging):"
            printf '%s\n' "$ALL_NAMES" | sed 's/^/  - /'
            exit 0
          fi

          echo "📦 Found packages to delete:"
          echo "$MATCHED" | sed 's/^/   - /'
          echo ""

          # Delete each matched package (entire package — all versions)
          DELETED=0
          FAILED=0

          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue

            echo "🗑️  Deleting package: $pkg"

            response=$(gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/orgs/$ORG/packages/nuget/$pkg" \
              -i 2>&1) || true

            status=$(echo "$response" | head -n 1 | awk '{print $2}')

            case "$status" in
              204)
                echo "   ✅ Deleted successfully"
                DELETED=$((DELETED + 1))
                ;;
              403)
                echo "   ❌ Forbidden on '$pkg'."
                echo "      Most likely: PACKAGES_TOKEN is missing the delete:packages scope,"
                echo "      is not owned by an org owner, or is not SSO-authorized for '$ORG'."
                echo "      Otherwise: grant Admin under Package settings -> Manage Actions access."
                FAILED=$((FAILED + 1))
                ;;
              404)
                echo "   ⚠️  Package not found (may already be deleted)"
                ;;
              *)
                echo "   ❌ Failed (HTTP $status)"
                echo "$response" | head -n 5
                FAILED=$((FAILED + 1))
                ;;
            esac
          done <<< "$MATCHED"

          echo ""
          echo "================================"
          echo "  Cleanup Summary"
          echo "================================"
          echo "  Organization:  $ORG"
          echo "  Prefix:        $PACKAGE_PREFIX"
          echo "  Deleted:       $DELETED"
          echo "  Failed:        $FAILED"
          echo "  Restore window: 30 days"
          echo "================================"
