# Promotes an already-published release from GitHub Packages to nuget.org.
#
# The GitHub Packages feed is the single source of truth: this workflow asks it
# which Backlot.* packages exist and which of them have the requested version.
# It never builds, packs, or reads the repository — there is no checkout. A
# version that is not on the feed simply cannot be promoted.
#
# Authentication to nuget.org uses Trusted Publishing (OIDC) — there is no
# long-lived API key. nuget.org validates the OIDC token against a policy that
# names this repository AND THIS WORKFLOW FILE NAME, so renaming this file
# breaks publishing until the policy is updated to match.
name: Publish to NuGet.org

on:
  workflow_dispatch:
    inputs:
      Version:
        description: 'Final version to promote from GitHub Packages to nuget.org (e.g. 0.0.2). Pre-release versions are not accepted.'
        required: true

permissions:
  packages: read
  id-token: write # required for the OIDC token exchange with nuget.org

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Backlot packages from GitHub Packages
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.Version }}
        run: |
          set -euo pipefail

          # The only guard: nuget.org publishes are irreversible, and a typo'd
          # pre-release version would otherwise be permanent.
          case "$VERSION" in
            *-*)
              echo "::error::Only final versions can be promoted to nuget.org (got '$VERSION')."
              exit 1
              ;;
          esac

          FEED="https://nuget.pkg.github.com/${OWNER}"
          mkdir -p nupkgs

          IDS=$(curl -sSf -u "${GH_ACTOR}:${GH_TOKEN}" \
            "${FEED}/query?q=Backlot&prerelease=true&take=200" \
            | jq -r '.data[].id | select(startswith("Backlot."))' | sort -u)

          if [ -z "$IDS" ]; then
            echo "::error::No Backlot.* packages found on the GitHub Packages feed for '${OWNER}'."
            exit 1
          fi

          # A package that has no build at this version is skipped, not an error:
          # the set of packages changes between releases.
          for id in $IDS; do
            lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
            out="nupkgs/${id}.${VERSION}.nupkg"
            if curl -sSL -f -u "${GH_ACTOR}:${GH_TOKEN}" -o "$out" \
                 "${FEED}/download/${lower}/${VERSION}/${lower}.${VERSION}.nupkg"; then
              echo "✅ ${id} ${VERSION}"
            else
              rm -f "$out"
              echo "➖ ${id} — no ${VERSION} on the feed, skipping"
            fi
          done

          COUNT=$(find nupkgs -name '*.nupkg' | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No Backlot.* package has version ${VERSION} on GitHub Packages. Nothing to promote."
            exit 1
          fi

          {
            echo "## Promoting ${COUNT} package(s) at version \`${VERSION}\` to nuget.org"
            echo ""
            find nupkgs -name '*.nupkg' -printf '  - %f\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      # Requested immediately before the push: the temporary key is valid for one
      # hour and each OIDC token buys exactly one key.
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Every file here was written by the download loop above, so the prefix and
      # version are already constrained. The filename check re-asserts that at the
      # point of no return: nothing reaches nuget.org unless it is a Backlot.*
      # package at exactly the requested version.
      #
      # --skip-duplicate makes re-running the same version a clean no-op rather
      # than a 409.
      - name: Push packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ inputs.Version }}
        run: |
          set -euo pipefail

          for nupkg in nupkgs/*.nupkg; do
            name=$(basename "$nupkg")
            case "$name" in
              Backlot.*.${VERSION}.nupkg) ;;
              *)
                echo "::error::Refusing to push '${name}': not a Backlot.* package at version ${VERSION}."
                exit 1
                ;;
            esac

            dotnet nuget push "$nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
